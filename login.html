<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | CampSlot</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo"><span>CampSlot</span></div>
      <nav>
        <a href="index.html">Home</a><a href="register.html">Register</a>
      </nav>
    </header>
    <div class="login-container">
      <div class="login-box">
        <h1>Welcome Back</h1>
        <p class="login-subtitle">Sign in to CampSlot</p>
        <div id="flash-box"></div>
        <form id="login-form">
          <label>Select Role</label
          ><select id="role">
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
            <option value="admin">Administrator</option>
          </select>
          <label>University Email</label
          ><input
            type="email"
            id="email"
            placeholder="student@lpu.in"
            required
          />
          <label>Password</label
          ><input type="password" id="password" placeholder="123" required />
          <button type="submit" class="login-submit">Login</button>
        </form>
        <div
          style="
            margin-top: 15px;
            padding: 10px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid #e2e8f0;
          "
        >
          <strong>Demo Logins (Password: 123):</strong><br />Admin: admin@lpu.in
          | Faculty: faculty@lpu.in | Student: student@lpu.in
        </div>
        <div class="back-home">
          <a href="register.html">Create an account</a>
        </div>
      </div>
    </div>
    <footer>
      <p>© 2026 CampSlot | Campus Room Availability System (CSE326)</p>
    </footer>
    <script src="js/app.js"></script>
    <script>
      const p = new URLSearchParams(window.location.search);
      if (p.get("role")) document.getElementById("role").value = p.get("role");
      document.getElementById("login-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const role = document.getElementById("role").value,
          email = document.getElementById("email").value.trim().toLowerCase(),
          pass = document.getElementById("password").value;
        const user = getDB().users.find(
          (u) =>
            u.email.toLowerCase() === email &&
            u.role === role &&
            u.password === pass,
        );
        if (!user) {
          showFlash("Invalid credentials or role.", "error");
          return;
        }
        localStorage.setItem(SESSION_KEY, JSON.stringify(user));
        redirectDashboard(user.role);
      });
    </script>
  </body>
</html>
