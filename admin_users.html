<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users | CampSlot</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo"><span>CampSlot</span></div>
      <nav>
        <a href="admin_dashboard.html">Dashboard</a
        ><a
          href="#"
          onclick="
            logout();
            return false;
          "
          >Logout</a
        >
      </nav>
    </header>
    <main class="admin-page">
      <div id="flash-box"></div>
      <div class="page-heading">
        <div><h1>Manage Users</h1></div>
        <a href="admin_dashboard.html" class="back-button">← Dashboard</a>
      </div>
      <div class="management-list">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Section/Dept</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="u-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
    <footer>
      <p>© 2026 CampSlot | Campus Room Availability System (CSE326)</p>
    </footer>
    <script src="js/app.js"></script>
    <script>
      const me = requireAuth("admin");
      function render() {
        document.getElementById("u-tbody").innerHTML = getDB()
          .users.map(
            (u) =>
              `<tr><td><strong>${u.name}</strong></td><td>${u.email}</td><td>${u.role.charAt(0).toUpperCase() + u.role.slice(1)}</td><td>${u.section || u.department || "-"}</td><td>${u.id !== me.id ? `<button class="delete-button" onclick="delU(${u.id})">Delete</button>` : "You"}</td></tr>`,
          )
          .join("");
      }
      window.delU = (id) => {
        const db = getDB();
        db.users = db.users.filter((x) => x.id !== id);
        saveDB(db);
        render();
      };
      render();
    </script>
  </body>
</html>
