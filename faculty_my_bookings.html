<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bookings | CampSlot</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo"><span>CampSlot</span></div>
      <nav>
        <a href="faculty_dashboard.html">Dashboard</a
        ><a
          href="#"
          onclick="
            logout();
            return false;
          "
          >Logout</a
        >
      </nav>
    </header>
    <main class="admin-page">
      <div class="page-heading">
        <div><h1>My Booking History</h1></div>
        <a href="faculty_dashboard.html" class="back-button">← Dashboard</a>
      </div>
      <div class="management-list">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Room</th>
                <th>Date</th>
                <th>Time</th>
                <th>Purpose</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="mt"></tbody>
          </table>
        </div>
      </div>
    </main>
    <footer>
      <p>© 2026 CampSlot | Campus Room Availability System (CSE326)</p>
    </footer>
    <script src="js/app.js"></script>
    <script>
      const u = requireAuth("faculty"),
        db = getDB();
      document.getElementById("mt").innerHTML = db.bookings
        .filter((b) => b.user_id === u.id)
        .reverse()
        .map((b) => {
          const r = db.rooms.find((x) => x.id === b.room_id);
          const c =
            b.status === "Approved"
              ? "badge-approved"
              : b.status === "Rejected"
                ? "badge-rejected"
                : "badge-pending";
          return `<tr><td><strong>${r ? r.room_number : "-"}</strong></td><td>${b.booking_date}</td><td>${b.start_time}-${b.end_time}</td><td>${b.purpose}</td><td><span class="badge ${c}">${b.status}</span></td></tr>`;
        })
        .join("");
    </script>
  </body>
</html>
