<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Room | CampSlot</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo"><span>CampSlot</span></div>
      <nav>
        <a href="faculty_dashboard.html">Dashboard</a
        ><a
          href="#"
          onclick="
            logout();
            return false;
          "
          >Logout</a
        >
      </nav>
    </header>
    <main class="building-page">
      <div id="flash-box"></div>
      <div class="building-heading">
        <div><h1>Request Room Booking</h1></div>
        <a href="faculty_dashboard.html" class="back-button">← Dashboard</a>
      </div>
      <div class="building-form-card" style="max-width: 550px; margin: auto">
        <form id="bf">
          <div class="form-group">
            <label>Room</label
            ><select id="br" required></select>
          </div>
          <div class="form-group">
            <label>Date</label><input type="date" id="bd" required />
          </div>
          <div class="form-group">
            <label>Start</label><input type="time" id="bs" required />
          </div>
          <div class="form-group">
            <label>End</label><input type="time" id="be" required />
          </div>
          <div class="form-group">
            <label>Purpose</label
            ><textarea id="bp" rows="3" required></textarea>
          </div>
          <button type="submit" class="building-submit">Submit Request</button>
        </form>
      </div>
    </main>
    <footer>
      <p>© 2026 CampSlot | Campus Room Availability System (CSE326)</p>
    </footer>
    <script src="js/app.js"></script>
    <script>
      const u = requireAuth("faculty"),
        db = getDB(),
        p = new URLSearchParams(location.search);
      document.getElementById("br").innerHTML = db.rooms
        .map(
          (r) =>
            `<option value="${r.id}">${r.room_number} (${r.room_type})</option>`,
        )
        .join("");
      document.getElementById("bd").value =
        p.get("date") || new Date().toISOString().split("T")[0];
      if (p.get("room")) document.getElementById("br").value = p.get("room");
      if (p.get("start")) document.getElementById("bs").value = p.get("start");
      if (p.get("end")) document.getElementById("be").value = p.get("end");
      document.getElementById("bf").addEventListener("submit", (e) => {
        e.preventDefault();
        const rid = Number(document.getElementById("br").value),
          d = document.getElementById("bd").value,
          s = document.getElementById("bs").value,
          en = document.getElementById("be").value;
        if (s >= en) {
          showFlash("End time must be after start time.", "error");
          return;
        }
        const c = checkRoomConflict(rid, d, s, en);
        if (c) {
          showFlash("Blocked! " + c, "error");
          return;
        }
        const ldb = getDB();
        ldb.bookings.push({
          id: Date.now(),
          user_id: u.id,
          room_id: rid,
          purpose: document.getElementById("bp").value,
          booking_date: d,
          start_time: s,
          end_time: en,
          status: "Pending",
        });
        saveDB(ldb);
        showFlash("Submitted for approval!");
        setTimeout(() => (location.href = "faculty_my_bookings.html"), 1000);
      });
    </script>
  </body>
</html>
