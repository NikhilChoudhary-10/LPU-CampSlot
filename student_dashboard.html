<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard | CampSlot</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo"><span>CampSlot</span></div>
      <nav>
        <a href="student_dashboard.html">Dashboard</a
        ><a
          href="#"
          onclick="
            logout();
            return false;
          "
          >Logout</a
        >
      </nav>
    </header>
    <main class="dashboard-container">
      <div class="admin-heading">
        <h1>Student Dashboard</h1>
        <p id="sw"></p>
      </div>
      <div class="dashboard-grid">
        <div class="dashboard-card">
          <div class="admin-card-icon">🔍</div>
          <h3>Room Availability</h3>
          <p>Check empty classrooms, labs & halls.</p>
          <a href="student_room_availability.html" class="admin-action"
            >Search Rooms →</a
          >
        </div>
        <div class="dashboard-card">
          <div class="admin-card-icon">🗓️</div>
          <h3>Section Timetable</h3>
          <p>View your weekly class schedule.</p>
          <a href="student_timetable.html" class="admin-action"
            >View Timetable →</a
          >
        </div>
      </div>
    </main>
    <footer>
      <p>© 2026 CampSlot | Campus Room Availability System (CSE326)</p>
    </footer>
    <script src="js/app.js"></script>
    <script>
      const u = requireAuth("student");
      if (u)
        document.getElementById("sw").textContent =
          `Welcome, ${u.name} (Section: ${u.section || "K4P26BH"})!`;
    </script>
  </body>
</html>
