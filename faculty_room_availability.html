<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Availability | CampSlot</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo"><span>CampSlot</span></div>
      <nav>
        <a href="faculty_dashboard.html">Dashboard</a
        ><a
          href="#"
          onclick="
            logout();
            return false;
          "
          >Logout</a
        >
      </nav>
    </header>
    <main class="admin-page">
      <div class="page-heading">
        <div><h1>Room Availability Search</h1></div>
        <a id="bd" href="#" class="back-button">← Dashboard</a>
      </div>
      <div class="filter-bar">
        <div class="form-group">
          <label>Date</label><input type="date" id="fd" />
        </div>
        <div class="form-group">
          <label>Start</label><input type="time" id="fs" value="10:00" />
        </div>
        <div class="form-group">
          <label>End</label><input type="time" id="fe" value="11:00" />
        </div>
        <div class="form-group">
          <label>Type</label
          ><select id="ft">
            <option value="">All</option>
            <option>Classroom</option>
            <option>Computer Lab</option>
            <option>Seminar Hall</option>
            <option>Lecture Hall</option>
          </select>
        </div>
        <button
          class="primary-btn"
          style="border: none; cursor: pointer"
          onclick="search()"
        >
          Search
        </button>
      </div>
      <div class="management-list">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Room</th>
                <th>Block</th>
                <th>Type</th>
                <th>Cap</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="at"></tbody>
          </table>
        </div>
      </div>
    </main>
    <footer>
      <p>© 2026 CampSlot | Campus Room Availability System (CSE326)</p>
    </footer>
    <script src="js/app.js"></script>
    <script>
      const u = requireAuth();
      document.getElementById("bd").href =
        u.role === "faculty"
          ? "faculty_dashboard.html"
          : "student_dashboard.html";
      document.getElementById("fd").value = new Date()
        .toISOString()
        .split("T")[0];
      function search() {
        const db = getDB(),
          d = document.getElementById("fd").value,
          s = document.getElementById("fs").value,
          e = document.getElementById("fe").value,
          t = document.getElementById("ft").value;
        document.getElementById("at").innerHTML = db.rooms
          .filter((r) => !t || r.room_type === t)
          .map((r) => {
            const b = db.blocks.find((x) => x.id === r.block_id),
              c = checkRoomConflict(r.id, d, s, e);
            const st = c
              ? `<span class="badge badge-occupied">Occupied</span>`
              : `<span class="badge badge-available">Available</span>`;
            const ac = c
              ? `<small style="color:#991b1b">${c}</small>`
              : u.role === "faculty"
                ? `<a href="faculty_book_room.html?room=${r.id}&date=${d}&start=${s}&end=${e}">Book →</a>`
                : "Free";
            return `<tr><td><strong>${r.room_number}</strong></td><td>${b ? b.block_name : "-"}</td><td>${r.room_type}</td><td>${r.capacity}</td><td>${st}</td><td>${ac}</td></tr>`;
          })
          .join("");
      }
      search();
    </script>
  </body>
</html>
