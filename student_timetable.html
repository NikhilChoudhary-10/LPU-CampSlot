<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Timetable | CampSlot</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo"><span>CampSlot</span></div>
      <nav>
        <a href="student_dashboard.html">Dashboard</a
        ><a
          href="#"
          onclick="
            logout();
            return false;
          "
          >Logout</a
        >
      </nav>
    </header>
    <main class="admin-page">
      <div class="page-heading">
        <div><h1>Section Timetable</h1></div>
        <a href="student_dashboard.html" class="back-button">← Dashboard</a>
      </div>
      <div class="management-list">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Day</th>
                <th>Time</th>
                <th>Subject</th>
                <th>Room</th>
                <th>Faculty</th>
              </tr>
            </thead>
            <tbody id="st"></tbody>
          </table>
        </div>
      </div>
    </main>
    <footer>
      <p>© 2026 CampSlot | Campus Room Availability System (CSE326)</p>
    </footer>
    <script src="js/app.js"></script>
    <script>
      const u = requireAuth("student"),
        db = getDB(),
        sec = (u.section || "K4P26BH").toUpperCase();
      document.getElementById("st").innerHTML = db.schedule
        .filter((s) => s.section.toUpperCase() === sec)
        .map((s) => {
          const r = db.rooms.find((x) => x.id === s.room_id),
            f = db.users.find((x) => x.id === s.faculty_id);
          return `<tr><td><strong>${s.day}</strong></td><td>${s.start_time}-${s.end_time}</td><td>${s.subject}</td><td>${r ? r.room_number : "-"}</td><td>${f ? f.name : "-"}</td></tr>`;
        })
        .join("");
    </script>
  </body>
</html>
